<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMPACT - All Featured Cases</title>

    <link rel="stylesheet" href="style.css" />

    <style>
      html {
        scrollbar-gutter: stable; /* ล็อคตำแหน่ง Navbar ไม่ให้ขยับ */
      }
    </style>

    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* ── โค้ดเดิมทั้งหมดของหน้าคอม ไม่มีการปรับเปลี่ยนขนาดใดๆ ── */
      :root {
        --impact-blue: #1e52a8;
        --impact-orange: #f26f21;
        --bg-color: #f8fafc;
        --text-main: #334155;
        --border-color: #e2e8f0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Noto Sans Thai", sans-serif;
        background-color: var(--bg-color);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* ── CONTENT AREA ── */
      .container {
        display: block !important; /* แก้บัค layout พังจาก style.css ภายนอก */
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 40px 100px;
        width: 100%;
      }

      /* ปุ่มกลับ */
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 30px;
        transition: color 0.2s ease;
      }
      .back-link:hover {
        color: var(--impact-blue);
      }

      .header-group {
        margin-bottom: 45px;
      }
      .label-tag {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--impact-orange);
        margin-bottom: 10px;
      }
      .label-tag::before {
        content: "";
        width: 20px;
        height: 2px;
        background: var(--impact-orange);
      }
      .main-title {
        font-size: 20px;
        font-weight: 800;
        color: #0f172a;
        line-height: 1.4;
      }

      /* GRID LAYOUT */
      .events-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px;
      }

      /* 🎨 สไตล์ Card */
      .custom-card {
        background: #fff;
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid #eef2f6;
        text-decoration: none;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
        cursor: pointer; /* แสดงผลให้รู้ว่าคลิกดูรูปได้ */
      }
      .custom-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 35px rgba(30, 82, 168, 0.08);
      }
      .card-img-box {
        height: 200px;
        background: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .card-img-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card-content {
        padding: 22px 24px 28px;
      }
      .card-label {
        font-size: 18px;
        font-weight: 800;
        color: #d97706;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        margin-bottom: 10px;
        display: block;
      }
      .card-title {
        font-size: 16px;
        font-weight: 800;
        color: #1e293b;
        line-height: 1.3;
      }

      /* =========================================
         ===== ระบบดูรูป (IMAGE MODAL) ======
         ========================================= */
      .image-modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(5px);
        justify-content: center;
        align-items: center;
        flex-direction: column;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .image-modal.show {
        display: flex;
        opacity: 1;
      }

      .close-btn {
        position: absolute;
        top: 30px;
        right: 40px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        font-family: "Noto Sans Thai", sans-serif;
        background: rgba(255, 255, 255, 0.1);
        padding: 10px 20px;
        border-radius: 100px;
        cursor: pointer;
        transition: 0.2s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        z-index: 1001;
      }

      .close-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }

      .modal-content {
        max-width: 90%;
        max-height: 85vh;
        object-fit: contain;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        transform: scale(0.9);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .image-modal.show .modal-content {
        transform: scale(1);
      }

      /* =========================================
         ===== MOBILE RESPONSIVE (เฉพาะมือถือ) ======
         ========================================= */
      @media (max-width: 768px) {
        .container {
          padding: 24px 20px 60px;
        }
        .events-grid {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .card-img-box {
          height: 180px;
        }
        .close-btn {
          top: 20px;
          right: 20px;
          font-size: 14px;
          padding: 8px 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- เรียกใช้ไฟล์ Navbar Component -->
    <script src="navbar.js"></script>

    <main class="container">
      <!-- ปุ่มย้อนกลับ -->
      <a href="event.html" class="back-link">
        <i class="fas fa-arrow-left"></i> กลับหน้า Showcase
      </a>

      <div class="header-group">
        <div class="label-tag">Featured Case</div>
        <h1 class="main-title">
          กรณีศึกษาจากงานที่ได้รับการรับรอง<br />มาตรฐานความยั่งยืน
        </h1>
      </div>

      <div class="events-grid">
        <!-- ใส่ onclick เพื่อกดดูรูปขยาย และเพิ่ม <img> ในกล่อง -->
        <a href="#" class="custom-card" onclick="handleCardClick(event, this)">
          <div class="card-img-box">
            <img
              src="images/Intertrek Staff Party.jpg"
              alt="Intertrek Party"
              onerror="
                this.src =
                  'https://via.placeholder.com/600x400/e2e8f0/64748b?text=Intertrek+Party'
              "
            />
          </div>
          <div class="card-content">
            <span class="card-label">Party</span>
            <h3 class="card-title">Intertrek Staff Party</h3>
          </div>
        </a>

        <a href="#" class="custom-card" onclick="handleCardClick(event, this)">
          <div class="card-img-box">
            <img
              src="images/HA 26 National.jpg"
              alt="HA 26 National"
              onerror="
                this.src =
                  'https://via.placeholder.com/600x400/e2e8f0/64748b?text=HA+26+National'
              "
            />
          </div>
          <div class="card-content">
            <span class="card-label">Meeting</span>
            <h3 class="card-title">HA 26 National</h3>
          </div>
        </a>
      </div>
    </main>

    <!-- ส่วนของการขยายภาพ (Modal) -->
    <div id="imageModal" class="image-modal" onclick="closeModal(event)">
      <div class="close-btn" onclick="closeModal(event)">
        <i class="fas fa-times"></i> ปิด
      </div>
      <img class="modal-content" id="modalImage" src="" alt="Enlarged View" />
    </div>

    <!-- Script ควบคุมการขยายรูป -->
    <script>
      function handleCardClick(event, element) {
        event.preventDefault(); // ป้องกันการเด้งไปบนสุด

        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");

        const imgElement = element.querySelector("img");

        if (imgElement && imgElement.src) {
          modalImg.src = imgElement.src;
        } else {
          modalImg.src =
            "https://via.placeholder.com/800x600/e2e8f0/64748b?text=No+Image";
        }

        modal.classList.add("show");
        document.body.style.overflow = "hidden"; // ป้องกันหน้าหลังเลื่อน
      }

      function closeModal(event) {
        const modal = document.getElementById("imageModal");
        const closeBtn = document.querySelector(".close-btn");

        if (
          !event ||
          event.target === modal ||
          event.target === closeBtn ||
          event.target.closest(".close-btn")
        ) {
          modal.classList.remove("show");
          document.body.style.overflow = "auto";
        }
      }

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          const modal = document.getElementById("imageModal");
          if (modal.classList.contains("show")) {
            closeModal();
          }
        }
      });
    </script>
  </body>
</html>
