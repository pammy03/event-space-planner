<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMPACT - หน้าหลัก</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* ❗ เหลือเฉพาะ layout หน้านี้ */
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #ffffff; /* ปรับพื้นหลังเป็นสีขาวให้กลืนกับรูป */
        overflow-x: hidden;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center; /* จัดให้อยู่กึ่งกลางแนวตั้งของจอ */
        justify-content: center;
        width: 100%;
        padding: 50px 10%; /* เว้นขอบซ้าย-ขวาให้สวยงาม */
      }

      /* Container สำหรับจัด Layout แบบ 2 คอลัมน์ ซ้าย-ขวา */
      .hero-wrapper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1300px;
        width: 100%;
        gap: 60px;
      }

      /* ฝั่งซ้าย: โลโก้ และ ข้อความ */
      .hero-text-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start; /* ข้อความชิดซ้าย */
        gap: 20px; /* เพิ่มระยะห่างระหว่างโลโก้กับข้อความ */
        max-width: 550px;
      }

      /* === ปรับโลโก้ให้อยู่ตรงกลางของพื้นที่ฝั่งซ้าย === */
      .sen-logo-img {
        width: 280px; /* ปรับขนาดให้ใหญ่ขึ้นตามรูป */
        height: auto;
        margin: 0 auto; /* บังคับให้รูปภาพอยู่กึ่งกลาง */
        display: block; /* จำเป็นต้องมี display: block เพื่อให้ margin: 0 auto ทำงาน */
      }

      .sen-description {
        color: #4a4a4a;
        font-size: 22px; /* ปรับขนาดให้ใกล้เคียงรูป */
        line-height: 1.6;
        font-family: "Sarabun", sans-serif;
      }

      .sen-description .highlight-red {
        color: #cc0000;
        font-weight: 600; /* ทำให้สีแดงดูหนาขึ้นตามรูปภาพ */
      }

      /* ฝั่งขวา: รูปภาพ */
      .hero-img-col {
        flex: 1.2; /* ให้พื้นที่ฝั่งรูปภาพกว้างกว่าเล็กน้อย */
        display: flex;
        justify-content: flex-end;
      }

      .sen-illustration-img {
        width: 100%;
        max-width: 600px; /* กำหนดขนาดสูงสุดของรูปภาพ */
        height: auto;
        display: block;
        object-fit: contain;
      }

      /* 📱 รองรับการแสดงผลบน มือถือ / แท็บเล็ต 📱 */
      @media (max-width: 992px) {
        .hero-wrapper {
          flex-direction: column;
          text-align: center;
          margin-top: 40px;
        }

        .hero-text-col {
          align-items: center;
          text-align: center; /* ให้ข้อความบนมือถือจัดกลางด้วย */
          max-width: 100%;
        }

        .sen-description {
          font-size: 20px;
        }

        .sen-logo-img {
          width: 280px;
        }

        .hero-img-col {
          justify-content: center;
          width: 100%;
          margin-top: 20px;
        }
      }
    </style>
  </head>

  <body>
    <header class="navbar">
      <div class="nav-left">
        <img
          src="images/logo-impact.svg"
          alt="IMPACT"
          onerror="
            this.src =
              'https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/IMPACT_Muang_Thong_Thani_Logo.png/800px-IMPACT_Muang_Thong_Thani_Logo.png'
          "
        />
      </div>

      <div class="nav-menu">
        <a href="index.html" class="nav-link active">
          <i class="fas fa-home"></i> หน้าหลัก
        </a>

        <a href="calculator.html" class="nav-link">
          <i class="fas fa-leaf"></i>
          <span>
            <span style="color: #28a745">S</span>ustainable Event Design
          </span>
        </a>

        <a href="event.html" class="nav-link">
          <i class="fas fa-images"></i>
          <span>
            <span style="color: #f26f21">E</span>vent Succession Showcase
          </span>
        </a>

        <a href="network.html" class="nav-link">
          <i class="fas fa-network-wired"></i>
          <span>
            <span style="color: #2354a2">N</span>etwork for Knowledge
          </span>
        </a>
      </div>
    </header>

    <main>
      <div class="hero-wrapper">
        <div class="hero-text-col">
          <img
            src="images/Logo SEN.png"
            alt="SEN SUSTAINEVENT NAVIGATOR"
            class="sen-logo-img"
          />
          <div class="sen-description">
            คือ การพัฒนาแพลตฟอร์มที่ช่วยให้การจัดงาน Event<br />
            ตามมาตรฐาน ISO 20121
            <span class="highlight-red">ให้เป็นเรื่องง่าย ใช้งานได้จริง</span
            ><br />
            ยกระดับองค์กรสู่การจัดงานอย่างยั่งยืนในระดับสากล
          </div>
        </div>

        <div class="hero-img-col">
          <img
            src="images/Eco-friendly.png"
            alt="SEN Illustration"
            class="sen-illustration-img"
          />
        </div>
      </div>
    </main>
  </body>
</html>
