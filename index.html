<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMPACT - หน้าหลัก</title>

    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* ===== BASE (Desktop) ตัด CSS ส่วน Navbar ออกไปแล้ว ===== */
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #ffffff;
        overflow-x: hidden;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 50px 10%;
        box-sizing: border-box;
      }

      .hero-wrapper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1300px;
        width: 100%;
        gap: 60px;
      }

      .hero-text-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
        max-width: 550px;
      }

      .sen-logo-img {
        width: 280px;
        height: auto;
        margin: 0 auto;
        display: block;
      }

      .sen-description {
        color: #4a4a4a;
        font-size: 22px;
        line-height: 1.6;
        font-family: "Sarabun", sans-serif;
      }

      .sen-description .highlight-red {
        color: #cc0000;
        font-weight: 600;
      }

      .hero-img-col {
        flex: 1.2;
        display: flex;
        justify-content: flex-end;
      }

      .sen-illustration-img {
        width: 100%;
        max-width: 600px;
        height: auto;
        display: block;
        object-fit: contain;
      }

      /* ===== MOBILE ONLY (max 768px) ===== */
      @media (max-width: 768px) {
        body {
          min-height: unset;
        }

        main {
          flex: unset;
          align-items: flex-start;
          padding: 28px 20px 36px;
        }

        .hero-wrapper {
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 18px;
        }

        .hero-text-col {
          align-items: center;
          text-align: center;
          max-width: 100%;
          gap: 14px;
        }

        .sen-logo-img {
          width: 200px;
          margin: 0 auto;
        }

        .sen-description {
          font-size: 16px;
          line-height: 1.85;
          text-align: center;
          color: #3a3a3a;
        }

        .hero-img-col {
          justify-content: center;
          width: 100%;
        }
        .sen-illustration-img {
          max-width: 100%;
          width: 100%;
          border-radius: 12px;
        }
      }

      @media (max-width: 400px) {
        .sen-logo-img {
          width: 175px;
        }
        .sen-description {
          font-size: 15px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <div class="hero-wrapper">
        <div class="hero-text-col">
          <img
            src="images/Logo SEN.png"
            alt="SEN SUSTAINEVENT NAVIGATOR"
            class="sen-logo-img"
          />
          <div class="sen-description">
            คือ การพัฒนาแพลตฟอร์มที่ช่วยให้การจัดงาน Event<br />
            ตามมาตรฐาน ISO 20121
            <span class="highlight-red">ให้เป็นเรื่องง่าย ใช้งานได้จริง</span
            ><br />
            ยกระดับองค์กรสู่การจัดงานอย่างยั่งยืนในระดับสากล
          </div>
        </div>

        <div class="hero-img-col">
          <img
            src="images/Eco-friendly.png"
            alt="SEN Illustration"
            class="sen-illustration-img"
          />
        </div>
      </div>
    </main>

    <!-- เรียกใช้ไฟล์ Navbar ที่เราสร้างไว้ (ใส่ไว้ก่อนปิด body) -->
    <script src="navbar.js"></script>
  </body>
</html>
