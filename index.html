<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMPACT - หน้าหลัก</title>

    <!-- ใช้ CSS กลางตัวเดียว -->
    <link rel="stylesheet" href="style.css" />

    <!-- Font เหมือนทุกหน้า -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* ❗ เหลือเฉพาะ layout หน้านี้ */
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #f8f9fa;
        overflow-x: hidden;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
      }

      .sen-header-row {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 50px;
        padding: 0 50px 0 7vw;
        margin-top: 10vh;
        max-width: 1440px;
        align-self: flex-start;
        position: relative;
      }

      .sen-logo-img {
        width: 280px;
        height: auto;
      }

      .sen-description {
        color: #4a4a4a;
        font-size: 22px;
        line-height: 1.6;
      }

      .sen-description .highlight-red {
        color: #cc0000;
        font-weight: 500;
      }

      .sen-illustration-row {
        width: 100%;
        line-height: 0;
        margin-top: -50vh;
      }

      .sen-illustration-img {
        width: 100vw;
        height: auto;
        display: block;
        object-fit: cover;
        object-position: bottom;
      }

      @media (max-width: 768px) {
        .sen-header-row {
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 20px;
          margin-top: 40px;
          padding: 0 20px;
        }

        .sen-logo-img {
          width: 220px;
        }

        .sen-description {
          font-size: 18px;
        }

        main {
          justify-content: flex-start;
          gap: 30px;
        }

        .sen-illustration-row {
          margin-top: auto;
        }
      }
    </style>
  </head>

  <body>
    <!-- ✅ Navbar (ใช้ style.css คุม 100%) -->
    <header class="navbar">
      <div class="nav-left">
        <img
          src="images/logo-impact.svg"
          alt="IMPACT"
          onerror="
            this.src =
              'https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/IMPACT_Muang_Thong_Thani_Logo.png/800px-IMPACT_Muang_Thong_Thani_Logo.png'
          "
        />
      </div>

      <div class="nav-menu">
        <a href="index.html" class="nav-link active">
          <i class="fas fa-home"></i> หน้าหลัก
        </a>

        <a href="calculator.html" class="nav-link">
          <i class="fas fa-leaf"></i>
          <span>
            <span style="color: #28a745">S</span>ustainable Event Design
          </span>
        </a>

        <a href="event.html" class="nav-link">
          <i class="fas fa-images"></i>
          <span>
            <span style="color: #f26f21">E</span>vent Succession Showcase
          </span>
        </a>

        <a href="network.html" class="nav-link">
          <i class="fas fa-network-wired"></i>
          <span>
            <span style="color: #2354a2">N</span>etwork for Knowledge
          </span>
        </a>
      </div>
    </header>

    <main>
      <div class="sen-header-row">
        <img
          src="images/Logo SEN.png"
          alt="SEN SUSTAINEVENT NAVIGATOR"
          class="sen-logo-img"
        />

        <div class="sen-description">
          คือ การพัฒนาแพลตฟอร์มที่ช่วยให้การจัดงาน Event<br />
          ตามมาตรฐาน ISO 20121
          <span class="highlight-red">ให้เป็นเรื่องง่าย ใช้งานได้จริง</span
          ><br />
          ยกระดับองค์กรสู่การจัดงานอย่างยั่งยืนในระดับสากล
        </div>
      </div>

      <div class="sen-illustration-row">
        <img
          src="images/SEN คืออะไร.png"
          alt="SEN Illustration"
          class="sen-illustration-img"
        />
      </div>
    </main>
  </body>
</html>
