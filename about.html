<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เกี่ยวกับเรา - IMPACT Sustain</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --impact-blue: #2354a2;
        --border-color: #cbd5e1;
        --text-main: #334155;
        --bg-main: #f8fafc;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Sarabun", "Inter", sans-serif;
        background-color: var(--bg-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Layout หลัก */
      .main-content {
        display: flex;
        gap: 20px;
        padding: 20px 40px;
        flex: 1;
        overflow: hidden;
      }

      /* Wrapper สำหรับมือถือ (ในคอมซ่อนไว้) */
      .mobile-sidebar-toggle {
        display: none;
      }
      .close-sidebar-mobile {
        display: none;
      }
      .sidebar-overlay {
        display: none;
      }

      /* กล่องใส่ Sidebar ที่เราจะให้ JS มาแทรก */
      #sidebar-container {
        width: 280px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        padding-right: 10px;
      }

      /* สไตล์สำหรับ Sidebar Component */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      #sidebar-container::-webkit-scrollbar,
      .main-area::-webkit-scrollbar {
        width: 6px;
      }
      #sidebar-container::-webkit-scrollbar-track,
      .main-area::-webkit-scrollbar-track {
        background: transparent;
      }
      #sidebar-container::-webkit-scrollbar-thumb,
      .main-area::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }

      .sidebar-item {
        display: flex;
        flex-direction: column;
      }

      .menu-btn {
        font-family: inherit;
        background-color: #fff;
        color: var(--impact-blue);
        border: 2px solid var(--impact-blue);
        padding: 14px 24px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 16px;
        width: 100%;
        justify-content: space-between;
        transition: 0.2s;
        cursor: pointer;
      }
      .menu-btn:hover,
      .menu-btn.active {
        background-color: var(--impact-blue);
        color: white;
      }

      .menu-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .icon-arrow {
        font-size: 18px;
        transition: 0.3s;
      }
      .menu-btn.collapsed .icon-arrow {
        transform: rotate(-90deg);
      }
      .submenu-wrapper {
        display: grid;
        grid-template-rows: 1fr;
        transition: 0.3s;
        opacity: 1;
      }
      .submenu-wrapper.collapsed {
        grid-template-rows: 0fr;
        opacity: 0;
      }
      .submenu-inner {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding-left: 35px;
        padding-top: 15px;
        padding-bottom: 5px;
      }
      .submenu-link {
        text-decoration: none;
        color: var(--text-main);
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 15px;
        transition: 0.2s;
      }
      .submenu-link:hover,
      .submenu-link.active {
        color: var(--impact-blue);
      }
      .submenu-link i {
        color: #64748b;
        font-size: 18px;
        width: 20px;
        text-align: center;
      }
      .submenu-link:hover i,
      .submenu-link.active i {
        color: var(--impact-blue);
      }

      /* Main Area */
      .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding-right: 10px;
        padding-bottom: 20px;
      }
      .content-box {
        background: #fff;
        border: 2px solid var(--border-color);
        padding: 40px;
        border-radius: 8px;
      }
      .box-title {
        font-size: 24px;
        font-weight: 800;
        color: var(--impact-blue);
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      /* เกี่ยวกับเรา Content */
      .about-container {
        display: flex;
        align-items: center;
        gap: 60px;
        justify-content: center;
        padding: 20px;
      }
      .about-logo {
        width: 260px;
        flex-shrink: 0;
      }
      .about-logo img {
        width: 100%;
        object-fit: contain;
      }
      .about-details {
        font-size: 18px;
        color: var(--text-main);
        line-height: 1.8;
      }
      .about-details strong {
        font-size: 22px;
        color: #000;
      }

      .cert-row {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
        margin-top: 30px;
        align-items: center;
      }

      .cert-group {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .sdg-group {
        gap: 0;
      }

      .cert-img {
        height: 65px;
        width: auto;
        object-fit: contain;
      }

      /* =========================================
         ===== MOBILE RESPONSIVE (เพิ่มระบบลิ้นชัก) ======
         ========================================= */
      @media (max-width: 768px) {
        body {
          overflow: auto;
          height: auto;
        }

        .main-content {
          flex-direction: column;
          padding: 15px 20px;
          overflow: visible;
        }

        .main-area {
          overflow: visible;
          padding-right: 0;
        }

        .content-box {
          padding: 20px;
        }

        .about-container {
          flex-direction: column; /* ให้โลโก้กับข้อมูลเรียงเป็นแนวตั้งบนมือถือ */
          gap: 30px;
          text-align: center;
        }

        .about-logo {
          width: 200px; /* ลดขนาดโลโก้ลงนิดนึงบนมือถือ */
        }

        .cert-row {
          justify-content: center; /* จัดให้อยู่ตรงกลาง */
        }

        .cert-img {
          height: 45px; /* ลดขนาดโลโก้ใบเซอร์บนมือถือ */
        }

        /* ปุ่มเปิดเมนูหมวดหมู่ (แสดงเฉพาะมือถือ) */
        .mobile-sidebar-toggle {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          background-color: var(--impact-blue);
          color: #fff;
          border: none;
          padding: 14px;
          border-radius: 8px;
          font-family: inherit;
          font-size: 16px;
          font-weight: 700;
          cursor: pointer;
          margin-bottom: 20px;
          box-shadow: 0 4px 12px rgba(35, 84, 162, 0.2);
          width: 100%;
        }

        /* กล่องคลุม Sidebar แปลงร่างเป็นลิ้นชักซ่อนข้างจอ */
        #mobile-sidebar-wrapper {
          position: fixed;
          top: 0;
          left: -100%;
          width: 300px;
          height: 100vh;
          background: #ffffff;
          z-index: 2000;
          padding: 20px 10px 20px 20px;
          box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
          transition: left 0.3s ease;
          display: flex;
          flex-direction: column;
        }

        #mobile-sidebar-wrapper.active {
          left: 0;
        }

        .close-sidebar-mobile {
          display: flex;
          align-self: flex-end;
          background: none;
          border: none;
          font-size: 24px;
          color: var(--text-main);
          cursor: pointer;
          margin-bottom: 15px;
          padding: 5px 10px;
        }

        .sidebar-overlay {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background: rgba(15, 23, 42, 0.6);
          backdrop-filter: blur(2px);
          z-index: 1999;
        }

        .sidebar-overlay.active {
          display: block;
        }

        #sidebar-container {
          width: 100%;
          height: 100%;
          overflow-y: auto;
          padding-right: 10px;
        }
      }
    </style>
  </head>
  <body>
    <!-- เรียกใช้ Navbar Component จาก navbar.js -->

    <div class="main-content">
      <!-- Overlay พื้นหลังสีดำ (คลิกเพื่อปิดเมนูได้) -->
      <div
        class="sidebar-overlay"
        id="sidebarOverlay"
        onclick="toggleMobileSidebar()"
      ></div>

      <!-- กล่องห่อหุ้ม Sidebar (ทำหน้าที่เป็นลิ้นชักซ่อนบนมือถือ) -->
      <div id="mobile-sidebar-wrapper">
        <button class="close-sidebar-mobile" onclick="toggleMobileSidebar()">
          <i class="fas fa-times"></i>
        </button>
        <!-- ตำแหน่งที่ sidebar.js จะนำเมนูมาใส่ -->
        <div id="sidebar-container"></div>
      </div>

      <!-- ส่วนเนื้อหาหลักด้านขวา -->
      <main class="main-area">
        <!-- ปุ่มกดเปิด Sidebar (จะโชว์เฉพาะในมือถือเท่านั้น) -->
        <button class="mobile-sidebar-toggle" onclick="toggleMobileSidebar()">
          <i class="fas fa-list-ul"></i> เลือกหมวดหมู่
        </button>

        <div class="content-box">
          <div class="box-title">
            <i
              class="fas fa-info-circle"
              style="color: var(--impact-blue); font-size: 30px"
            ></i>
            เกี่ยวกับเรา
          </div>
          <div class="about-container">
            <div class="about-logo">
              <img
                src="images/logo-impact.svg"
                alt="IMPACT Logo"
                onerror="
                  this.src =
                    'https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/IMPACT_Muang_Thong_Thani_Logo.png/800px-IMPACT_Muang_Thong_Thani_Logo.png'
                "
              />
            </div>
            <div class="about-details">
              <strong>Standard Control Department</strong><br />
              <i
                class="fas fa-phone-alt fa-flip-horizontal"
                style="color: #64748b; margin-right: 8px"
              ></i>
              02- 8336372, 6373, 6374<br />
              <i
                class="fas fa-envelope"
                style="color: #64748b; margin-right: 8px"
              ></i>
              QA_SD_Group@impact.co.th

              <div class="cert-row">
                <div class="cert-group">
                  <img src="images/SGS (2).png" alt="SGS" class="cert-img" />
                  <img src="images/SGS.png" alt="SGS" class="cert-img" />
                </div>

                <div class="cert-group sdg-group">
                  <img
                    src="images/4 quality.png"
                    alt="SDG 4"
                    class="cert-img"
                  />
                  <img
                    src="images/7 affordable.png"
                    alt="SDG 7"
                    class="cert-img"
                  />
                  <img src="images/8 Decent.png" alt="SDG 8" class="cert-img" />
                  <img
                    src="images/11 sustainable.png"
                    alt="SDG 11"
                    class="cert-img"
                  />
                  <img
                    src="images/12 responsible.png"
                    alt="SDG 12"
                    class="cert-img"
                  />
                  <img
                    src="images/13 climate.png"
                    alt="SDG 13"
                    class="cert-img"
                  />
                  <img
                    src="images/17 partnerships.png"
                    alt="SDG 17"
                    class="cert-img"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- เรียกใช้ Component ทั้ง Navbar และ Sidebar -->
    <script src="navbar.js"></script>
    <script src="sidebar.js"></script>

    <!-- Script สำหรับเปิด-ปิดเมนูบนมือถือ -->
    <script>
      function toggleMobileSidebar() {
        const wrapper = document.getElementById("mobile-sidebar-wrapper");
        const overlay = document.getElementById("sidebarOverlay");

        wrapper.classList.toggle("active");
        overlay.classList.toggle("active");

        // ล็อกไม่ให้จอหลังเลื่อนเวลาเปิดเมนู
        if (wrapper.classList.contains("active")) {
          document.body.style.overflow = "hidden";
        } else {
          document.body.style.overflow = "auto";
        }
      }
    </script>
  </body>
</html>
