<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMPACT - Carbon Calculator</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* ===== BASE (Desktop) รูปแบบดั้งเดิม ไม่เปลี่ยนแปลง ===== */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #f8f9fa;
      }

      main {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 2rem;
      }

      .container {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        max-width: 1400px;
        width: 100%;
        gap: 4rem;
        margin: 0 auto;
      }

      .content-left {
        flex: 1;
        min-width: 400px;
      }

      .content-right {
        flex: 1;
        display: flex;
        justify-content: center;
        min-width: 400px;
      }

      .hero-image {
        max-width: 100%;
        height: auto;
      }

      /* ===== MOBILE ONLY (จัดการเฉพาะขนาดมือถือ) ===== */
      /* ===== MOBILE ONLY (เน้นรูปใหญ่และขยับขึ้นด้านบน) ===== */
      @media (max-width: 768px) {
        main {
          padding: 1rem;
          /* เปลี่ยนจาก align-items: center เป็น flex-start เพื่อดันเนื้อหาขึ้นบน */
          align-items: flex-start;
          padding-top: 2rem; /* ปรับระยะห่างจากด้านบนตามความเหมาะสม */
        }

        .container {
          flex-direction: column-reverse;
          gap: 1rem; /* ลด Gap เพื่อให้ทุกอย่างขยับชิดกันขึ้น */
          text-align: center;
        }

        .content-left,
        .content-right {
          min-width: 100%;
          flex: none;
        }

        /* ปรับรูปภาพให้ใหญ่ขึ้นเกือบเต็มจอ */
        .hero-image {
          max-width: 100%; /* เพิ่มขนาดรูปให้ใหญ่ขึ้น */
          height: auto;
          margin: 0 auto;
        }

        .eco-badge {
          display: inline-flex;
          margin: 0 auto 0.8rem auto;
          font-size: 12px;
        }

        .content-left h1 {
          font-size: 24px !important;
          line-height: 1.2 !important;
          margin: 5px 0 10px 0 !important;
        }

        .content-left h1 .highlight-green {
          font-size: 18px !important;
          display: block;
          margin-top: 4px;
        }

        .content-left .description {
          font-size: 14px !important;
          line-height: 1.5 !important;
          margin: 0 auto 20px auto !important;
          max-width: 95%;
        }

        .button-group {
          width: 100%;
        }

        .btn {
          width: 100%;
          padding: 14px 0 !important;
          display: flex;
          justify-content: center;
          font-size: 16px !important;
          border-radius: 12px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Navbar ดึงจาก Component navbar.js -->

    <main>
      <div class="container">
        <div class="content-left">
          <div class="eco-badge">
            <i class="fa-solid fa-leaf"></i>Eco-Friendly Event Planner
          </div>

          <h1>
            IMPACT Carbon Calculator
            <span class="highlight-green">วางแผนจัดงานอย่างยั่งยืน</span>
          </h1>

          <p class="description">
            ร่วมเป็นส่วนหนึ่งในการลดการปล่อยก๊าซเรือนกระจก
            เครื่องมือจำลองพื้นที่และคำนวณคาร์บอนฟุตพริ้นท์
          </p>

          <div class="button-group">
            <a href="design.html" class="btn btn-primary">
              <i class="fa-solid fa-calculator"></i> เริ่มต้นคำนวณ
            </a>
          </div>
        </div>

        <div class="content-right">
          <img src="images/calculator.png" class="hero-image" />
        </div>
      </div>
    </main>

    <!-- Script สำหรับเรียกใช้ Navbar -->
    <script src="navbar.js"></script>
  </body>
</html>
