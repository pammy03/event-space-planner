<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แหล่งอ้างอิง - IMPACT Sustain</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --impact-blue: #2354a2;
        --border-color: #cbd5e1;
        --text-main: #334155;
        --bg-main: #f8fafc;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Sarabun", "Inter", sans-serif;
        background-color: var(--bg-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .main-content {
        display: flex;
        gap: 20px;
        padding: 20px 40px;
        flex: 1;
        overflow: hidden;
      }
      .sidebar {
        width: 280px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        padding-right: 10px;
      }

      .sidebar::-webkit-scrollbar,
      .main-area::-webkit-scrollbar {
        width: 6px;
      }
      .sidebar::-webkit-scrollbar-track,
      .main-area::-webkit-scrollbar-track {
        background: transparent;
      }
      .sidebar::-webkit-scrollbar-thumb,
      .main-area::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }

      .sidebar-item {
        display: flex;
        flex-direction: column;
      }

      .menu-btn {
        font-family: inherit;
        background-color: #fff;
        color: var(--impact-blue);
        border: 2px solid var(--impact-blue);
        padding: 14px 24px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 16px;
        width: 100%;
        justify-content: space-between;
        transition: 0.2s;
        cursor: pointer;
      }
      .menu-btn:hover,
      .menu-btn.active {
        background-color: var(--impact-blue);
        color: white;
      }

      .menu-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .icon-arrow {
        font-size: 18px;
        transition: 0.3s;
      }
      .menu-btn.collapsed .icon-arrow {
        transform: rotate(-90deg);
      }
      .submenu-wrapper {
        display: grid;
        grid-template-rows: 1fr;
        transition: 0.3s;
        opacity: 1;
      }
      .submenu-wrapper.collapsed {
        grid-template-rows: 0fr;
        opacity: 0;
      }
      .submenu-inner {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding-left: 35px;
        padding-top: 15px;
        padding-bottom: 5px;
      }
      .submenu-link {
        text-decoration: none;
        color: var(--text-main);
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 15px;
        transition: 0.2s;
      }
      .submenu-link:hover,
      .submenu-link.active {
        color: var(--impact-blue);
      }
      .submenu-link i {
        color: #64748b;
        font-size: 18px;
        width: 20px;
        text-align: center;
      }
      .submenu-link:hover i,
      .submenu-link.active i {
        color: var(--impact-blue);
      }

      .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding-right: 10px;
        padding-bottom: 20px;
      }
      .content-box {
        background: #fff;
        border: 2px solid var(--border-color);
        padding: 30px;
        border-radius: 8px;
      }

      .box-title {
        font-size: 18px;
        font-weight: 800;
        color: var(--impact-blue);
        margin-bottom: 40px; /* ปรับระยะห่างให้พอดี */
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .ref-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px; /* ⬇️ ลดช่องว่างระหว่างคอลัมน์ เพื่อให้รูปขยายได้กว้างขึ้น */
        padding: 10px 0;
        align-items: center;
        justify-items: center;
      }

      .ref-item {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 160px; /* ⬆️ เพิ่มความสูงของพื้นที่ลิงก์ */
        text-decoration: none;
      }

      /* ✅ ปรับความใหญ่ของโลโก้ */
      .ref-logo {
        width: 100%;
        height: 100%;
        max-width: 260px; /* ⬆️ เพิ่มขีดจำกัดความกว้าง */
        max-height: 150px; /* ⬆️ เพิ่มขีดจำกัดความสูง */
        object-fit: contain;
        /* หากรูปยังมีขอบใสเยอะทำให้ดูเล็ก สามารถปลดคอมเมนต์บรรทัดล่างเพื่อบังคับซูมได้ครับ */
        /* transform: scale(1.15); */
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <div class="nav-left">
        <img
          src="images/logo-impact.svg"
          alt="IMPACT"
          onerror="
            this.src =
              'https://upload.wikimedia.org/wikipedia/commons/thumb/1/11/IMPACT_Muang_Thong_Thani_Logo.png/800px-IMPACT_Muang_Thong_Thani_Logo.png'
          "
        />
      </div>

      <div class="nav-menu">
        <a href="index.html" class="nav-link">
          <i class="fas fa-home"></i> หน้าหลัก
        </a>

        <a href="calculator.html" class="nav-link">
          <i class="fas fa-leaf"></i>
          <span>
            <span style="color: #28a745">S</span>ustainable Event Design
          </span>
        </a>

        <a href="event.html" class="nav-link">
          <i class="fas fa-images"></i>
          <span>
            <span style="color: #f26f21">E</span>vent Succession Showcase
          </span>
        </a>

        <a href="network.html" class="nav-link active">
          <i class="fas fa-network-wired"></i>
          <span>
            <span style="color: #2354a2">N</span>etwork for Knowledge
          </span>
        </a>
      </div>
    </header>

    <div class="main-content">
      <aside class="sidebar">
        <div class="sidebar-item">
          <button
            class="menu-btn collapsed"
            id="knowledgeToggleBtn"
            onclick="toggleKnowledgeMenu()"
          >
            <div class="menu-left">
              <i class="fas fa-book-open"></i> แหล่งความรู้ทั้งหมด
            </div>
            <i class="fas fa-chevron-down icon-arrow"></i>
          </button>
          <div class="submenu-wrapper collapsed" id="knowledgeSubmenu">
            <div class="submenu-inner">
              <a href="network.html" class="submenu-link"
                ><i class="far fa-lightbulb"></i> สื่อการเรียนรู้</a
              >
              <a href="video.html" class="submenu-link"
                ><i class="fab fa-youtube"></i> วิดีโอ</a
              >
              <a href="law.html" class="submenu-link"
                ><i class="fas fa-gavel"></i> กฎหมายที่เกี่ยวข้อง</a
              >
            </div>
          </div>
        </div>
        <div class="sidebar-item">
          <a href="sustainability.html" class="menu-btn"
            ><div class="menu-left">
              <i class="fas fa-leaf" style="color: #4caf50"></i>
              อิมแพ็คกับความยั่งยืน
            </div></a
          >
        </div>
        <div class="sidebar-item">
          <a href="faq.html" class="menu-btn"
            ><div class="menu-left">
              <i class="fas fa-question-circle"></i> คำถามที่พบบ่อย
            </div></a
          >
        </div>
        <div class="sidebar-item">
          <a href="about.html" class="menu-btn"
            ><div class="menu-left">
              <i class="fas fa-info-circle"></i> เกี่ยวกับเรา
            </div></a
          >
        </div>
        <div class="sidebar-item">
          <a href="reference.html" class="menu-btn active"
            ><div class="menu-left">
              <i class="fas fa-link"></i> แหล่งอ้างอิง
            </div></a
          >
        </div>
      </aside>

      <main class="main-area">
        <div class="content-box">
          <div class="box-title">
            <i class="fas fa-search" style="font-size: 26px"></i>
            แหล่งอ้างอิง
          </div>

          <div class="ref-grid">
            <a
              href="#"
              target="_blank"
              class="ref-item"
              title="ไปที่เว็บไซต์ TGO"
            >
              <img src="images/tgo.png" alt="TGO Logo" class="ref-logo" />
            </a>

            <a
              href="#"
              target="_blank"
              class="ref-item"
              title="ไปที่เว็บไซต์ DCCE"
            >
              <img
                src="images/กรมการเปลี่ยนแปลง.png"
                alt="DCCE Logo"
                class="ref-logo"
              />
            </a>

            <a
              href="#"
              target="_blank"
              class="ref-item"
              title="ไปที่เว็บไซต์ TCEB"
            >
              <img src="images/TCEB.png" alt="TCEB Logo" class="ref-logo" />
            </a>

            <a
              href="#"
              target="_blank"
              class="ref-item"
              title="ไปที่เว็บไซต์ UN Thailand"
            >
              <img
                src="images/United.png"
                alt="UN Thailand Logo"
                class="ref-logo"
              />
            </a>
          </div>
        </div>
      </main>
    </div>
    <script>
      function toggleKnowledgeMenu() {
        document
          .getElementById("knowledgeToggleBtn")
          .classList.toggle("collapsed");
        document
          .getElementById("knowledgeSubmenu")
          .classList.toggle("collapsed");
      }
    </script>
  </body>
</html>
