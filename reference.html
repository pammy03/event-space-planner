<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แหล่งอ้างอิง - IMPACT Sustain</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --impact-blue: #2354a2;
        --border-color: #cbd5e1;
        --text-main: #334155;
        --bg-main: #f8fafc;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Sarabun", "Inter", sans-serif;
        background-color: var(--bg-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Layout หลัก */
      .main-content {
        display: flex;
        gap: 20px;
        padding: 20px 40px;
        flex: 1;
        overflow: hidden;
      }

      /* Wrapper สำหรับมือถือ (ในคอมซ่อนไว้) */
      .mobile-sidebar-toggle {
        display: none;
      }
      .close-sidebar-mobile {
        display: none;
      }
      .sidebar-overlay {
        display: none;
      }

      /* กล่องใส่ Sidebar ที่เราจะให้ JS มาแทรก */
      #sidebar-container {
        width: 280px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        padding-right: 10px;
      }

      /* สไตล์สำหรับ Sidebar Component */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      #sidebar-container::-webkit-scrollbar,
      .main-area::-webkit-scrollbar {
        width: 6px;
      }
      #sidebar-container::-webkit-scrollbar-track,
      .main-area::-webkit-scrollbar-track {
        background: transparent;
      }
      #sidebar-container::-webkit-scrollbar-thumb,
      .main-area::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }

      .sidebar-item {
        display: flex;
        flex-direction: column;
      }

      .menu-btn {
        font-family: inherit;
        background-color: #fff;
        color: var(--impact-blue);
        border: 2px solid var(--impact-blue);
        padding: 14px 24px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 16px;
        width: 100%;
        justify-content: space-between;
        transition: 0.2s;
        cursor: pointer;
      }
      .menu-btn:hover,
      .menu-btn.active {
        background-color: var(--impact-blue);
        color: white;
      }

      .menu-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .icon-arrow {
        font-size: 18px;
        transition: 0.3s;
      }
      .menu-btn.collapsed .icon-arrow {
        transform: rotate(-90deg);
      }
      .submenu-wrapper {
        display: grid;
        grid-template-rows: 1fr;
        transition: 0.3s;
        opacity: 1;
      }
      .submenu-wrapper.collapsed {
        grid-template-rows: 0fr;
        opacity: 0;
      }
      .submenu-inner {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding-left: 35px;
        padding-top: 15px;
        padding-bottom: 5px;
      }
      .submenu-link {
        text-decoration: none;
        color: var(--text-main);
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 15px;
        transition: 0.2s;
      }
      .submenu-link:hover,
      .submenu-link.active {
        color: var(--impact-blue);
      }
      .submenu-link i {
        color: #64748b;
        font-size: 18px;
        width: 20px;
        text-align: center;
      }
      .submenu-link:hover i,
      .submenu-link.active i {
        color: var(--impact-blue);
      }

      /* Main Area */
      .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding-right: 10px;
        padding-bottom: 20px;
      }
      .content-box {
        background: #fff;
        border: 2px solid var(--border-color);
        padding: 30px;
        border-radius: 8px;
      }

      .box-title {
        font-size: 18px;
        font-weight: 800;
        color: var(--impact-blue);
        margin-bottom: 40px;
        display: flex;
        align-items: center;
        gap: 15px;
      }

      /* จัดเรียงโลโก้ */
      .ref-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        padding: 10px 0;
        align-items: center;
        justify-items: center;
      }

      .ref-item {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 160px;
        text-decoration: none;
      }

      .ref-logo {
        width: 100%;
        height: 100%;
        max-width: 260px;
        max-height: 150px;
        object-fit: contain;
      }

      /* =========================================
         ===== MOBILE RESPONSIVE (เพิ่มระบบลิ้นชัก) ======
         ========================================= */
      @media (max-width: 768px) {
        body {
          overflow: auto;
          height: auto;
        }

        .main-content {
          flex-direction: column;
          padding: 15px 20px;
          overflow: visible;
        }

        .main-area {
          overflow: visible;
          padding-right: 0;
        }

        .content-box {
          padding: 20px;
        }

        .ref-grid {
          grid-template-columns: repeat(
            2,
            1fr
          ); /* บนมือถือเรียง 2 โลโก้ต่อแถว */
          gap: 15px;
        }

        .ref-item {
          height: 100px; /* ลดความสูงกล่องโลโก้บนมือถือ */
        }

        .ref-logo {
          max-width: 100%;
          max-height: 80px; /* ลดขนาดโลโก้บนมือถือ */
        }

        /* ปุ่มเปิดเมนูหมวดหมู่ (แสดงเฉพาะมือถือ) */
        .mobile-sidebar-toggle {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          background-color: var(--impact-blue);
          color: #fff;
          border: none;
          padding: 14px;
          border-radius: 8px;
          font-family: inherit;
          font-size: 16px;
          font-weight: 700;
          cursor: pointer;
          margin-bottom: 20px;
          box-shadow: 0 4px 12px rgba(35, 84, 162, 0.2);
          width: 100%;
        }

        /* กล่องคลุม Sidebar แปลงร่างเป็นลิ้นชักซ่อนข้างจอ */
        #mobile-sidebar-wrapper {
          position: fixed;
          top: 0;
          left: -100%;
          width: 300px;
          height: 100vh;
          background: #ffffff;
          z-index: 2000;
          padding: 20px 10px 20px 20px;
          box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
          transition: left 0.3s ease;
          display: flex;
          flex-direction: column;
        }

        #mobile-sidebar-wrapper.active {
          left: 0;
        }

        .close-sidebar-mobile {
          display: flex;
          align-self: flex-end;
          background: none;
          border: none;
          font-size: 24px;
          color: var(--text-main);
          cursor: pointer;
          margin-bottom: 15px;
          padding: 5px 10px;
        }

        .sidebar-overlay {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background: rgba(15, 23, 42, 0.6);
          backdrop-filter: blur(2px);
          z-index: 1999;
        }

        .sidebar-overlay.active {
          display: block;
        }

        #sidebar-container {
          width: 100%;
          height: 100%;
          overflow-y: auto;
          padding-right: 10px;
        }
      }
    </style>
  </head>
  <body>
    <!-- เรียกใช้ Navbar Component จาก navbar.js -->

    <div class="main-content">
      <!-- Overlay พื้นหลังสีดำ (คลิกเพื่อปิดเมนูได้) -->
      <div
        class="sidebar-overlay"
        id="sidebarOverlay"
        onclick="toggleMobileSidebar()"
      ></div>

      <!-- กล่องห่อหุ้ม Sidebar (ทำหน้าที่เป็นลิ้นชักซ่อนบนมือถือ) -->
      <div id="mobile-sidebar-wrapper">
        <button class="close-sidebar-mobile" onclick="toggleMobileSidebar()">
          <i class="fas fa-times"></i>
        </button>
        <!-- ตำแหน่งที่ sidebar.js จะนำเมนูมาใส่ -->
        <div id="sidebar-container"></div>
      </div>

      <!-- ส่วนเนื้อหาหลักด้านขวา -->
      <main class="main-area">
        <!-- ปุ่มกดเปิด Sidebar (จะโชว์เฉพาะในมือถือเท่านั้น) -->
        <button class="mobile-sidebar-toggle" onclick="toggleMobileSidebar()">
          <i class="fas fa-list-ul"></i> เลือกหมวดหมู่
        </button>

        <div class="content-box">
          <div class="box-title">
            <i class="fas fa-search" style="font-size: 26px"></i>
            แหล่งอ้างอิง
          </div>

          <div class="ref-grid">
            <a
              href="#"
              target="_blank"
              class="ref-item"
              title="ไปที่เว็บไซต์ TGO"
            >
              <img src="images/tgo.png" alt="TGO Logo" class="ref-logo" />
            </a>

            <a
              href="#"
              target="_blank"
              class="ref-item"
              title="ไปที่เว็บไซต์ DCCE"
            >
              <img
                src="images/กรมการเปลี่ยนแปลง.png"
                alt="DCCE Logo"
                class="ref-logo"
              />
            </a>

            <a
              href="#"
              target="_blank"
              class="ref-item"
              title="ไปที่เว็บไซต์ TCEB"
            >
              <img src="images/TCEB.png" alt="TCEB Logo" class="ref-logo" />
            </a>

            <a
              href="#"
              target="_blank"
              class="ref-item"
              title="ไปที่เว็บไซต์ UN Thailand"
            >
              <img
                src="images/United.png"
                alt="UN Thailand Logo"
                class="ref-logo"
              />
            </a>
          </div>
        </div>
      </main>
    </div>

    <!-- เรียกใช้ Component ทั้ง Navbar และ Sidebar -->
    <script src="navbar.js"></script>
    <script src="sidebar.js"></script>

    <!-- Script สำหรับเปิด-ปิดเมนูบนมือถือ -->
    <script>
      function toggleMobileSidebar() {
        const wrapper = document.getElementById("mobile-sidebar-wrapper");
        const overlay = document.getElementById("sidebarOverlay");

        wrapper.classList.toggle("active");
        overlay.classList.toggle("active");

        // ล็อกไม่ให้จอหลังเลื่อนเวลาเปิดเมนู
        if (wrapper.classList.contains("active")) {
          document.body.style.overflow = "hidden";
        } else {
          document.body.style.overflow = "auto";
        }
      }
    </script>
  </body>
</html>
