<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>สื่อการเรียนรู้ - IMPACT Sustain</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --impact-blue: #2354a2;
        --border-color: #cbd5e1;
        --text-main: #334155;
        --bg-main: #f8fafc;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Sarabun", "Inter", sans-serif;
        background-color: var(--bg-main);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* SIDEBAR */
      .main-content {
        display: flex;
        gap: 20px;
        padding: 20px 40px;
        flex: 1;
        overflow: hidden;
      }

      /* Wrapper สำหรับมือถือ (ในคอมซ่อนปุ่ม) */
      .mobile-sidebar-toggle {
        display: none;
      }
      .close-sidebar-mobile {
        display: none;
      }
      .sidebar-overlay {
        display: none;
      }

      /* กล่องใส่ Sidebar ที่เราจะให้ JS มาแทรก */
      #sidebar-container {
        width: 280px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        padding-right: 10px;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      #sidebar-container::-webkit-scrollbar,
      .main-area::-webkit-scrollbar {
        width: 6px;
      }
      #sidebar-container::-webkit-scrollbar-track,
      .main-area::-webkit-scrollbar-track {
        background: transparent;
      }
      #sidebar-container::-webkit-scrollbar-thumb,
      .main-area::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }

      .sidebar-item {
        display: flex;
        flex-direction: column;
      }

      .menu-btn {
        font-family: inherit;
        background-color: #fff;
        color: var(--impact-blue);
        border: 2px solid var(--impact-blue);
        padding: 14px 24px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 16px;
        width: 100%;
        justify-content: space-between;
        transition: 0.2s;
        cursor: pointer;
      }
      .menu-btn:hover,
      .menu-btn.active {
        background-color: var(--impact-blue);
        color: white;
      }

      .menu-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .icon-arrow {
        font-size: 18px;
        transition: 0.3s;
      }
      .menu-btn.collapsed .icon-arrow {
        transform: rotate(-90deg);
      }
      .submenu-wrapper {
        display: grid;
        grid-template-rows: 1fr;
        transition: 0.3s;
        opacity: 1;
      }
      .submenu-wrapper.collapsed {
        grid-template-rows: 0fr;
        opacity: 0;
      }
      .submenu-inner {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding-left: 35px;
        padding-top: 15px;
        padding-bottom: 5px;
      }
      .submenu-link {
        text-decoration: none;
        color: var(--text-main);
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 15px;
        transition: 0.2s;
      }
      .submenu-link:hover,
      .submenu-link.active {
        color: var(--impact-blue);
      }
      .submenu-link i {
        color: #64748b;
        font-size: 18px;
        width: 20px;
        text-align: center;
      }
      .submenu-link:hover i,
      .submenu-link.active i {
        color: var(--impact-blue);
      }

      /* CONTENT */
      .main-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        padding-right: 10px;
        padding-bottom: 20px;
      }
      .content-box {
        background: #fff;
        border: 2px solid var(--border-color);
        padding: 24px;
        border-radius: 8px;
      }
      .box-title {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-main);
        margin-bottom: 20px;
      }
      .box-title-blue {
        color: var(--impact-blue);
        font-size: 18px;
      }

      .resource-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        margin-top: 10px;
      }
      .learning-item-card {
        background: #fff;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: 0.2s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      }
      .learning-item-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      }
      .resource-thumbnail {
        width: 100%;
        height: 180px;
        background: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
        font-size: 40px;
        border-bottom: 1px solid var(--border-color);
        overflow: hidden;
      }
      .resource-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }
      .resource-details {
        padding: 15px;
        display: flex;
        flex-direction: column;
        flex: 1;
        justify-content: space-between;
      }
      .resource-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-main);
        line-height: 1.5;
        margin-bottom: 15px;
      }
      .details-btn {
        background-color: transparent;
        border: 2px solid var(--impact-blue);
        color: var(--impact-blue);
        padding: 10px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 16px;
        text-align: center;
        text-decoration: none;
        transition: 0.2s;
        display: block;
        width: 100%;
      }
      .details-btn:hover {
        background-color: var(--impact-blue);
        color: white;
      }

      /* =========================================
         ===== MOBILE RESPONSIVE (เพิ่มระบบลิ้นชัก) ======
         ========================================= */
      @media (max-width: 768px) {
        body {
          overflow: auto; /* ปลดล็อก scroll body */
          height: auto;
        }

        .main-content {
          flex-direction: column; /* เรียงบน-ล่าง */
          padding: 15px 20px;
          overflow: visible;
        }

        .main-area {
          overflow: visible; /* ให้เลื่อนตามหน้าจอ */
          padding-right: 0;
        }

        .resource-grid {
          grid-template-columns: 1fr; /* การ์ดเรียงแถวเดียว */
        }

        /* 1. ปุ่มเปิดเมนูหมวดหมู่ (แสดงเฉพาะมือถือ) */
        .mobile-sidebar-toggle {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          background-color: var(--impact-blue);
          color: #fff;
          border: none;
          padding: 14px;
          border-radius: 8px;
          font-family: inherit;
          font-size: 16px;
          font-weight: 700;
          cursor: pointer;
          margin-bottom: 20px;
          box-shadow: 0 4px 12px rgba(35, 84, 162, 0.2);
          width: 100%;
        }

        /* 2. กล่องคลุม Sidebar แปลงร่างเป็นลิ้นชักซ่อนข้างจอ */
        #mobile-sidebar-wrapper {
          position: fixed;
          top: 0;
          left: -100%; /* ซ่อนไว้ทางซ้ายสุด */
          width: 300px;
          height: 100vh;
          background: #ffffff;
          z-index: 2000;
          padding: 20px 10px 20px 20px;
          box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
          transition: left 0.3s ease;
          display: flex;
          flex-direction: column;
        }

        /* เลื่อนออกมาเมื่อใส่ class active */
        #mobile-sidebar-wrapper.active {
          left: 0;
        }

        /* 3. ปุ่ม X ปิดเมนูบนมือถือ */
        .close-sidebar-mobile {
          display: flex;
          align-self: flex-end;
          background: none;
          border: none;
          font-size: 24px;
          color: var(--text-main);
          cursor: pointer;
          margin-bottom: 15px;
          padding: 5px 10px;
        }

        /* 4. พื้นหลังสีดำจางๆ (Overlay) */
        .sidebar-overlay {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background: rgba(15, 23, 42, 0.6);
          backdrop-filter: blur(2px);
          z-index: 1999;
        }

        .sidebar-overlay.active {
          display: block;
        }

        /* ปรับ Sidebar เดิมให้เข้ากับกล่องใหม่บนมือถือ */
        #sidebar-container {
          width: 100%;
          height: 100%;
          overflow-y: auto;
          padding-right: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-content">
      <div
        class="sidebar-overlay"
        id="sidebarOverlay"
        onclick="toggleMobileSidebar()"
      ></div>

      <div id="mobile-sidebar-wrapper">
        <button class="close-sidebar-mobile" onclick="toggleMobileSidebar()">
          <i class="fas fa-times"></i>
        </button>
        <div id="sidebar-container"></div>
      </div>

      <main class="main-area">
        <button class="mobile-sidebar-toggle" onclick="toggleMobileSidebar()">
          <i class="fas fa-list-ul"></i> เลือกหมวดหมู่
        </button>

        <div class="content-box">
          <div class="box-title box-title-blue">แหล่งความรู้ทั้งหมด</div>
          <div class="box-title" style="font-size: 16px; margin-top: 10px">
            <i class="far fa-lightbulb"></i> สื่อการเรียนรู้
          </div>
          <div class="resource-grid">
            <div class="learning-item-card">
              <div class="resource-thumbnail">
                <img
                  src="images/เปรียบเทียบกลไก.png"
                  alt="คาร์บอนเครดิต"
                  class="resource-img"
                />
              </div>
              <div class="resource-details">
                <p class="resource-title">
                  คาร์บอนเครดิต (Carbon Credit)
                  คือสิทธิในการปล่อยก๊าซเรือนกระจก...
                </p>
                <a
                  href="https://www.tgo.or.th/2023/index.php/th/post/%E0%B8%84%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%9A%E0%B8%AD%E0%B8%99%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%94%E0%B8%B4%E0%B8%95-carbon-credit-%E0%B8%81%E0%B8%B1%E0%B8%9A-%E0%B8%AA%E0%B8%B4%E0%B8%97%E0%B8%98%E0%B8%B4%E0%B9%83%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%9B%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%81%E0%B9%8A%E0%B8%B2%E0%B8%8B%E0%B9%80%E0%B8%A3%E0%B8%B7%E0%B8%AD%E0%B8%99%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%88%E0%B8%81-allowance-%E0%B8%95%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B8%AD%E0%B8%A2%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B9%84%E0%B8%A3-890"
                  target="_blank"
                  class="details-btn"
                  >กดดูรายละเอียด</a
                >
              </div>
            </div>

            <div class="learning-item-card">
              <div class="resource-thumbnail">
                <img
                  src="images/CFO&CFP.png"
                  alt="ข้อมูลคาร์บอนฟุตพริ้นท์"
                  class="resource-img"
                />
              </div>
              <div class="resource-details">
                <p class="resource-title">
                  ข้อมูลคาร์บอนฟุตพริ้นท์ขององค์กร และผลิตภัณฑ์
                  สามารถใช้ร่วมกันได้มั้ย
                </p>
                <a
                  href="https://thaicarbonlabel.tgo.or.th/"
                  target="_blank"
                  class="details-btn"
                  >กดดูรายละเอียด</a
                >
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="navbar.js"></script>
    <script src="sidebar.js"></script>

    <script>
      function toggleMobileSidebar() {
        const wrapper = document.getElementById("mobile-sidebar-wrapper");
        const overlay = document.getElementById("sidebarOverlay");

        wrapper.classList.toggle("active");
        overlay.classList.toggle("active");

        // ล็อกไม่ให้จอหลังเลื่อนเวลาเปิดเมนู
        if (wrapper.classList.contains("active")) {
          document.body.style.overflow = "hidden";
        } else {
          document.body.style.overflow = "auto";
        }
      }
    </script>
  </body>
</html>
